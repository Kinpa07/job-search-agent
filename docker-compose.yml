services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobsearch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jobsearch
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      TZ: Europe/Sofia
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: nobody  # temp: suppresses Celery root warning — replace with Dockerfile USER directive in Module 12
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jobsearch
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      TZ: Europe/Sofia
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: celery -A src.app.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: nobody  # temp: suppresses Celery root warning — replace with Dockerfile USER directive in Module 12
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jobsearch
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      TZ: Europe/Sofia
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A src.app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data:
